services:
  backend:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: ui
      dockerfile: Dockerfile
    environment:
      BACKEND_URL: https://company-risk-assessment-api.adnel.org
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
